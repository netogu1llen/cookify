# JVM arguments for the Gradle daemon. AGP 9 + KSP on a multi-module build needs headroom.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Compose compiler diagnostics. Flip to true when chasing recomposition problems;
# reports land in build/compose-metrics and build/compose-reports.
enableComposeCompilerMetrics=false
enableComposeCompilerReports=false
